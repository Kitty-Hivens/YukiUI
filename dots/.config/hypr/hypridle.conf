$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # Before sleep the shell locks without the lock's fade: the compositor counts
    # the session locked on the lock's first frame and inhibit_sleep lets the
    # machine sleep on that, so a fade went to sleep see-through. lock-session
    # follows for whatever else listens, and for hyprlock when the shell is not up.
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockNow")' ; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
